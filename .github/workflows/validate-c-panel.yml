name: Validate C-PANEL
on:
  workflow_dispatch:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npx tsc --noEmit
      - run: npx eslint app/c-panel components/access-restricted.tsx
